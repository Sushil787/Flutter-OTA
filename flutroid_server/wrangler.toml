name = "flutroid-ota"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# R2 bucket for release/patch artifacts (create: `wrangler r2 bucket create flutroid-artifacts`)
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "flutroid-artifacts"

# D1 database for release/patch metadata (create: `wrangler d1 create flutroid-db`,
# then paste the returned database_id below)
[[d1_databases]]
binding = "DB"
database_name = "flutroid-db"
database_id = "<paste-database-id-here>"

# Set an upload secret so only your CLI can push artifacts:
#   wrangler secret put UPLOAD_TOKEN
