name: flutroid_package
description: Flutroid OTA updater — checks the backend for patches, downloads them, and stages them for the engine to load on the next launch.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutroid
        pluginClass: FlutroidPlugin
